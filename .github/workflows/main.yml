name: main

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Hatch
        run: |
          python -m pip install --upgrade pip
          pip install hatch hatchling

      # The version is hardcoded in urlscan/__init__.py, so a tag can disagree
      # with it. Fail here rather than publishing the wrong version to PyPI.
      - name: Verify tag matches __version__
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(hatch version 2>/dev/null | tail -n1 | tr -d '[:space:]')
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ $version"
            exit 1
          fi

      # Non-tag builds go to TestPyPI, which rejects duplicate versions. Give
      # each one a unique .devN suffix.
      - name: Set dev version for TestPyPI
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: |
          python - <<'EOF'
          import os, pathlib, re
          init = pathlib.Path("urlscan/__init__.py")
          text = init.read_text()
          current = re.search(r'^__version__ = "(.+)"$', text, re.M).group(1)
          major, minor, patch = (int(p) for p in current.split("."))
          dev = f'{major}.{minor}.{patch + 1}.dev{os.environ["GITHUB_RUN_NUMBER"]}'
          init.write_text(text.replace(f'__version__ = "{current}"',
                                       f'__version__ = "{dev}"', 1))
          print(f"building {dev}")
          EOF

      - name: Build package
        run: hatch build

      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: urlscan
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/urlscan  # Replace <package-name> with your PyPI project name
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: urlscan
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: >-
      Sign the with Sigstore and upload to GitHub Release
    needs:
      - publish-to-pypi
    runs-on: ubuntu-latest

    permissions:
      contents: write  # IMPORTANT: mandatory for making GitHub Releases
      id-token: write  # IMPORTANT: mandatory for sigstore

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all tags and history
      # checkout leaves the tag as a lightweight ref, which drops the
      # annotation `make release` wrote. Re-fetch to restore the tag objects.
      - name: Restore annotated tags
        run: git fetch --force --tags
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: urlscan
          path: dist/
      - name: Sign the dists with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl
      # The release notes are the tag message body: %(contents:body) skips the
      # subject line (just the version) and any GPG signature.
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git for-each-ref --format='%(contents:body)' "refs/tags/$GITHUB_REF_NAME" \
            | gh release create "$GITHUB_REF_NAME" \
                --repo "$GITHUB_REPOSITORY" \
                --title "$GITHUB_REF_NAME" \
                --verify-tag \
                --notes-file -
      - name: Upload artifact signatures to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Upload to GitHub Release using the `gh` CLI.
        # `dist/` contains the built packages, and the
        # sigstore-produced signatures and certificates.
        run: >-
          gh release upload
          '${{ github.ref_name }}' dist/**
          --repo '${{ github.repository }}'

  publish-to-testpypi:
    name: Publish to TestPyPI
    needs:
      - build
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/urlscan

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: urlscan
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
